<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lector Math Ultrarrápido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería OCR para leer los números -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            background-color: #09090b;
            color: white;
            font-family: ui-sans-serif, system-ui, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #app-layout {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        #camera-section {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
            border-bottom: 2px solid #27272a;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* Overlay eliminado */

        #result-section {
            height: 30vh;
            min-height: 180px;
            background: linear-gradient(180deg, #18181b 0%, #09090b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .huge-number {
            font-size: 6rem;
            font-weight: 900;
            line-height: 1;
            color: #3b82f6;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }

        #setup-screen {
            position: absolute;
            inset: 0;
            background: #09090b;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        #hidden-canvas { display: none; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1 class="text-3xl font-bold mb-2 text-center text-white">Lector Math</h1>
        <p class="text-zinc-400 mb-8 max-w-xs text-center text-sm">Cargando motor de IA (OCR)...</p>
        
        <button id="btn-start" disabled class="bg-zinc-700 text-zinc-400 font-bold py-4 px-10 rounded-full shadow-lg text-lg w-full max-w-xs transition-colors">
            Iniciando...
        </button>
    </div>

    <div id="app-layout" style="display: none;">
        <div id="camera-section">
            <video id="video" autoplay playsinline webkit-playsinline muted disablePictureInPicture></video>
            
            <div id="rescue-btn" class="absolute inset-0 bg-black/70 hidden flex-col items-center justify-center z-40 pointer-events-auto">
                <p class="text-white font-bold text-lg border border-white/50 px-6 py-3 rounded-full animate-pulse backdrop-blur-md">
                    Tocar para reanudar cámara
                </p>
            </div>
        </div>

        <div id="result-section">
            <div class="absolute top-4 left-4 flex items-center gap-2">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse" id="status-indicator"></div>
                <span class="text-xs text-zinc-400 font-mono uppercase tracking-wider" id="status-text">Analizando...</span>
            </div>
            
            <p class="text-zinc-500 text-sm mb-2">Operación detectada:</p>
            <div id="equation-display" class="text-2xl font-bold text-zinc-300 mb-2">---</div>
            <div id="result" class="huge-number">?</div>
        </div>
    </div>

    <canvas id="hidden-canvas"></canvas>

    <script>
        const setupScreen = document.getElementById('setup-screen');
        const appLayout = document.getElementById('app-layout');
        const video = document.getElementById('video');
        const hiddenCanvas = document.getElementById('hidden-canvas');
        const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
        
        const btnStart = document.getElementById('btn-start');
        const rescueBtn = document.getElementById('rescue-btn');
        const resultDisplay = document.getElementById('result');
        const equationDisplay = document.getElementById('equation-display');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');

        let isRunning = false;
        let isEngineReady = false;
        let worker = null;
        let isRecognizing = false;
        
        // Mantener el último resultado en pantalla un rato
        let lastAnswer = null;
        let timeSinceLastSuccess = 0;

        async function initTesseract() {
            try {
                worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789+-xX*=?/ ',
                });
                
                isEngineReady = true;
                btnStart.disabled = false;
                btnStart.textContent = "Encender Cámara";
                btnStart.classList.replace('bg-zinc-700', 'bg-blue-600');
                btnStart.classList.replace('text-zinc-400', 'text-white');
                document.querySelector('#setup-screen p').textContent = "Motor de IA listo.";
            } catch (err) {
                console.error(err);
                document.querySelector('#setup-screen p').textContent = "Error al cargar IA. Recarga la página.";
            }
        }

        initTesseract();

        rescueBtn.addEventListener('click', () => {
            video.play().then(() => rescueBtn.classList.replace('flex', 'hidden'));
        });

        video.addEventListener('pause', () => {
            if (isRunning) rescueBtn.classList.replace('hidden', 'flex');
        });
        
        video.addEventListener('play', () => {
            rescueBtn.classList.replace('flex', 'hidden');
        });

        btnStart.addEventListener('click', async () => {
            if (!isEngineReady) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 480 }, height: { ideal: 640 } },
                    audio: false
                });
                
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play().catch(() => rescueBtn.classList.replace('hidden', 'flex'));
                    setupScreen.style.display = 'none';
                    appLayout.style.display = 'flex';
                    isRunning = true;
                    
                    // Cortamos a la mitad superior y bajamos resolución para que la IA vuele (10x más rápido)
                    const scale = Math.min(1, 400 / video.videoHeight);
                    hiddenCanvas.width = video.videoWidth * scale;
                    // Solo el 45% superior de la cámara donde está la pregunta
                    hiddenCanvas.height = (video.videoHeight * scale) * 0.45;
                    
                    processFrames();
                };

            } catch (err) {
                alert("No se pudo iniciar la cámara. Revisa los permisos.");
            }
        });

        function processFrames() {
            if (!isRunning) return;
            if (video.paused || video.videoWidth === 0) {
                requestAnimationFrame(processFrames);
                return;
            }

            // Solo dibujamos y analizamos la mitad superior del video
            hiddenCtx.drawImage(
                video, 
                0, 0, video.videoWidth, video.videoHeight * 0.45,
                0, 0, hiddenCanvas.width, hiddenCanvas.height
            );

            if (!isRecognizing) {
                isRecognizing = true;
                
                statusIndicator.classList.replace('bg-emerald-500', 'bg-yellow-500');
                statusText.textContent = "Procesando...";

                // Dejar que Tesseract maneje el contraste internamente (es más seguro para texto blanco sobre botones de colores claros)


                worker.recognize(hiddenCanvas).then(({ data: { text } }) => {
                    let equationAnswer = null;
                    let detectedEq = "";
                    
                    const cleanText = text.replace(/\s+/g, ' ');
                    
                    const match = cleanText.match(/(\d+)\s*([\+\-\xX\/])\s*(\d+)/);
                    
                    if (match) {
                        const num1 = parseInt(match[1]);
                        let op = match[2].toLowerCase();
                        if (op === 'x') op = '*';
                        const num2 = parseInt(match[3]);
                        
                        if (op === '+') equationAnswer = num1 + num2;
                        if (op === '-') equationAnswer = num1 - num2;
                        if (op === '*') equationAnswer = num1 * num2;
                        if (op === '/') equationAnswer = num1 / num2;
                        
                        detectedEq = `${num1} ${op} ${num2}`;
                        
                        equationDisplay.textContent = detectedEq;
                        resultDisplay.textContent = equationAnswer;
                        resultDisplay.classList.replace('text-zinc-500', 'text-blue-500');
                        
                        lastAnswer = equationAnswer;
                        timeSinceLastSuccess = Date.now();
                    } else {
                        if (Date.now() - timeSinceLastSuccess > 2000) {
                            lastAnswer = null;
                            equationDisplay.textContent = "---";
                            resultDisplay.textContent = "?";
                            resultDisplay.classList.replace('text-blue-500', 'text-zinc-500');
                        }
                    }

                    statusIndicator.classList.replace('bg-yellow-500', 'bg-emerald-500');
                    statusText.textContent = "Lectura activa";
                    isRecognizing = false;
                }).catch(err => {
                    console.error(err);
                    isRecognizing = false;
                });
            }

            requestAnimationFrame(processFrames);
        }

        // Dibujado en pantalla eliminado a petición del usuario
    </script>
</body>
</html>
